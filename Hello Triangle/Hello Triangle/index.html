<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Aditya Shekhar Nittala"/>
  <meta name="description" content="Hello WebGL Triangle"/>
  <title>Simple WebGL Triangle</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="myCanvas" width="400" height="400"></canvas>

<script>
  // We will put our WebGL code here
  // Get WebGL context
  const canvas = document.getElementById("myCanvas");
  const gl = canvas.getContext("webgl");

  // Vertex shader program
  const vsSource = `
    attribute vec4 aVertexPosition;
    void main(void) {
        gl_Position = aVertexPosition;
    }
`;

  // Fragment shader program
  const fsSource = `
    void main(void) {
        gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
    }
`;

  // Initialize shaders
  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

  // Create shader program
  const shaderProgram = createProgram(gl, vertexShader, fragmentShader);

  gl.useProgram(shaderProgram);
  // Set up triangle vertices

  const vertices = new Float32Array([
    -1.0, -1.0, 0.0, //first vertex
    1.0, -1.0, 0.0, // second vertex
    0.0, 0.0, 0.0  // third vertex
  ]);



  //  vertices = [
  //   0.0,  1.0, 0,
  //   -1.0, -1.0, 0,
  //   1.0, -1.0, 0
  // ];


  const positionAttributeLocation = gl.getAttribLocation(shaderProgram, "aVertexPosition");
  const vertexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

  // Bind vertex buffer to shader attribute

  gl.enableVertexAttribArray(positionAttributeLocation);
  gl.vertexAttribPointer(positionAttributeLocation, 3, gl.FLOAT, false,0, 0);

  // Clear canvas
  gl.clearColor(1.0, 0.0, 1.0, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // Draw triangle
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // Helper functions to create shaders and program
  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error("An error occurred compiling the shaders:", gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function createProgram(gl, vertexShader, fragmentShader) {
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error("Unable to initialize the shader program:", gl.getProgramInfoLog(program));
      return null;
    }
    return program;
  }
</script>
</body>
</html>
