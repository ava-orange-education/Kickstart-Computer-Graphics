<!DOCTYPE html>
<html>
<head>
  <title>WebGL Projections</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
</head>
<body>
<canvas id="glCanvas" width="600" height="600"></canvas>
<select id="projectionType">
  <option value="isometric">Isometric</option>
  <option value="axonometric">Axonometric</option>
  <option value="parallel">Parallel</option>
  <option value="planOblique">Plan Oblique</option>
  <option value="onePoint">One Point Perspective</option>
  <option value="threePoint">Three Point Perspective</option>
</select>
<script type="text/javascript">
  const canvas = document.getElementById("glCanvas");
  const gl = canvas.getContext("webgl");

  const vertexShaderSource = `
      attribute vec4 aPosition;
      uniform mat4 uProjectionMatrix;
      void main(void) {
        gl_Position = uProjectionMatrix * aPosition;
      }
    `;

  const fragmentShaderSource = `
      void main(void) {
        gl_FragColor = vec4(1.0, 0.25, 0.50, 1.0);
      }
    `;

  const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
  const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

  const program = createProgram(gl, vertexShader, fragmentShader);
  gl.useProgram(program);

  const aPosition = gl.getAttribLocation(program, "aPosition");
  const uProjectionMatrix = gl.getUniformLocation(program, "uProjectionMatrix");

  // Define the vertices for the cube without using indices
  const positions = new Float32Array([
    // Front face
    -0.5, -0.5,  0.5,
    0.5, -0.5,  0.5,
    0.5,  0.5,  0.5,
    -0.5, -0.5,  0.5,
    0.5,  0.5,  0.5,
    -0.5,  0.5,  0.5,

    // Back face
    -0.5, -0.5, -0.5,
    -0.5,  0.5, -0.5,
    0.5,  0.5, -0.5,
    -0.5, -0.5, -0.5,
    0.5,  0.5, -0.5,
    0.5, -0.5, -0.5,

    // Top face
    -0.5,  0.5, -0.5,
    -0.5,  0.5,  0.5,
    0.5,  0.5,  0.5,
    -0.5,  0.5, -0.5,
    0.5,  0.5,  0.5,
    0.5,  0.5, -0.5,

    // Bottom face
    -0.5, -0.5, -0.5,
    0.5, -0.5, -0.5,
    0.5, -0.5,  0.5,
    -0.5, -0.5, -0.5,
    0.5, -0.5,  0.5,
    -0.5, -0.5,  0.5,

    // Right face
    0.5, -0.5, -0.5,
    0.5,  0.5, -0.5,
    0.5,  0.5,  0.5,
    0.5, -0.5, -0.5,
    0.5,  0.5,  0.5,
    0.5, -0.5,  0.5,

    // Left face
    -0.5, -0.5, -0.5,
    -0.5, -0.5,  0.5,
    -0.5,  0.5,  0.5,
    -0.5, -0.5, -0.5,
    -0.5,  0.5,  0.5,
    -0.5,  0.5, -0.5,
  ]);

  const positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function createProgram(gl, vertexShader, fragmentShader) {
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(program));
      gl.deleteProgram(program);
      return null;
    }
    return program;
  }

  function setProjection(type) {
    let projectionMatrix = mat4.create();
    let viewMatrix = mat4.create();
    switch (type) {
      case "isometric":
        mat4.ortho(projectionMatrix, -1, 1, -1, 1, -10, 10);
        mat4.rotateX(projectionMatrix, projectionMatrix, Math.PI / 4);
        mat4.rotateY(projectionMatrix, projectionMatrix, Math.PI / 4);
        break;
      case "axonometric":
        mat4.ortho(projectionMatrix, -1, 1, -1, 1, -10, 10);
        mat4.rotateX(projectionMatrix, projectionMatrix, Math.PI / 6);
        mat4.rotateY(projectionMatrix, projectionMatrix, Math.PI / 6);
        break;
      case "parallel":
        mat4.ortho(projectionMatrix, -1, 1, -1, 1, -10, 10);
        break;
      case "planOblique":
        mat4.ortho(projectionMatrix, -1, 1, -1, 1, -10, 10);
        mat4.rotateX(projectionMatrix, projectionMatrix, Math.PI / 4);
        let obliqueAngle = Math.PI / 4; // 45 degrees for plan oblique
        projectionMatrix[8] = Math.cos(obliqueAngle);
        projectionMatrix[9] = Math.sin(obliqueAngle);
        break;
      case "onePoint":
        mat4.perspective(projectionMatrix, Math.PI / 4, 1, 0.1, 100);
        mat4.lookAt(viewMatrix, [0, 0, 2], [0, 0, 0], [0, 1, 0]);
        mat4.multiply(projectionMatrix, projectionMatrix, viewMatrix);
        break;
      case "threePoint":
        mat4.perspective(projectionMatrix, Math.PI / 4, 1, 0.1, 100);
        mat4.lookAt(viewMatrix, [2, 2, 2], [0, 0, 0], [0, 1, 0]);
        mat4.multiply(projectionMatrix, projectionMatrix, viewMatrix);
        break;
    }
    gl.uniformMatrix4fv(uProjectionMatrix, false, projectionMatrix);
  }

  function drawScene() {
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enableVertexAttribArray(aPosition);
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, positions.length / 3);
    gl.disableVertexAttribArray(aPosition);
  }

  document.getElementById("projectionType").addEventListener("change", (event) => {
    setProjection(event.target.value);
    drawScene();
  });

  gl.clearColor(1, 1, 1, 1);
  gl.enable(gl.DEPTH_TEST);

  setProjection("isometric");
  drawScene();
</script>
</body>
</html>
